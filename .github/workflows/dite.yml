name: DITE verification

on:
  push:
    branches: [main, codex/dite-mobile]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: Logic and reproducible bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: motore/package-lock.json
      - run: npm ci
        working-directory: motore
      - name: All logic, migration and navigation checks
        run: node motore/tbaseline.js node
      - name: Rebuild offline game
        run: python3 motore/build.py
      - name: Verify published web bundle is current
        run: cmp motore/site/index.html arena/index.html
      - name: Verify native bundle and licenses are current
        run: python3 scripts/ios_sync.py --check
      - name: Verify native project and packaging contracts
        run: |
          python3 scripts/ios_project.py --check
          python3 scripts/ios_test.py
      - name: Verify original app artwork
        run: |
          python3 -m venv .build/assets-venv
          .build/assets-venv/bin/python -m pip install -r scripts/requirements-assets.txt
          .build/assets-venv/bin/python scripts/generate_assets.py --check

  browser:
    name: Touch and rendering regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: motore/package-lock.json
      - run: npm ci
        working-directory: motore
      - run: npx playwright install --with-deps chromium-headless-shell
        working-directory: motore
      - name: Full browser suite
        run: node motore/tbaseline.js browser
      - name: Preserve real browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            motore/shots/
            motore/logs/
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS ${{ matrix.family }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile, launch offline and exercise WebKit app
        run: bash scripts/ci_ios.sh '${{ matrix.family }}'
      - name: Preserve native build and simulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ matrix.family }}-evidence
          path: |
            .build/logs/
            .build/xctest-attachments/
            .build/*.xcresult/
            .build/*.zip
            .build/*.json
            .build/*.png
          if-no-files-found: warn
          retention-days: 14
